openapi: 3.0.3
info:
  title: AI Agent Management API
  description: |
    AI 代理配置和监控 API，允许查看和调整代理行为参数。

    **注意**: 此 API 主要用于管理员和高级用户，普通用户仅有只读权限。
  version: 1.0.0

servers:
  - url: https://api.happystock.com
    description: 生产环境
  - url: http://localhost:8000
    description: 本地开发环境

security:
  - BearerAuth: []

tags:
  - name: agents
    description: AI 代理管理
  - name: pools
    description: 代理池管理

paths:
  /api/sim/sessions/{session_id}/agents:
    get:
      tags:
        - agents
      summary: 获取会话中的 AI 代理列表
      description: 列出指定会话中所有活跃的 AI 代理及其配置。
      operationId: listAgents
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: behavior_category
          in: query
          description: 按行为类别过滤
          required: false
          schema:
            type: string
            enum: [retail, prop, institutional, market_maker]
      responses:
        '200':
          description: AI 代理列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentListResponse'
              example:
                agents:
                  - agent_id: retail-agent-001
                    participant_id: retail-001
                    behavior_category: retail
                    weight: 1.0
                    cash_balance: 98500.0
                    inventory: 150.0
                    performance:
                      total_trades: 45
                      win_rate: 0.48
                      pnl: -1500.0
                      avg_trade_size: 12.5
                    config:
                      profit_target: 0.05
                      stop_loss: 0.02
                      herd_behavior_strength: 0.70
                      momentum_sensitivity: 0.30
                      risk_tolerance: 0.60
                  - agent_id: prop-agent-001
                    participant_id: prop-001
                    behavior_category: prop
                    weight: 2.5
                    cash_balance: 305000.0
                    inventory: 0.0
                    performance:
                      total_trades: 28
                      win_rate: 0.61
                      pnl: 5000.0
                      avg_trade_size: 120.0
                    config:
                      profit_target: 0.03
                      stop_loss: 0.015
                      herd_behavior_strength: 0.20
                      momentum_sensitivity: 0.60
                      risk_tolerance: 0.80
                total: 12
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 会话不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sim/sessions/{session_id}/agents/{agent_id}:
    get:
      tags:
        - agents
      summary: 获取单个 AI 代理详情
      description: 获取指定 AI 代理的详细信息，包括配置和交易历史。
      operationId: getAgent
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AgentId'
      responses:
        '200':
          description: AI 代理详情
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentDetail'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 代理不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sim/sessions/{session_id}/agents/{agent_id}/config:
    put:
      tags:
        - agents
      summary: 更新 AI 代理配置
      description: |
        动态调整 AI 代理的行为参数。

        **权限要求**: 需要管理员权限或会话创建者。

        **注意**: 配置变更在下一 tick 生效。
      operationId: updateAgentConfig
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AgentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentConfigUpdate'
            example:
              profit_target: 0.04
              stop_loss: 0.018
              herd_behavior_strength: 0.75
      responses:
        '200':
          description: 配置更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigUpdateResponse'
              example:
                status: updated
                agent_id: retail-agent-001
                message: Configuration will take effect on next tick
                effective_tick: 1235
        '400':
          description: 参数验证失败
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: invalid_config
                message: profit_target must be between 0 and 1
                field: profit_target
                value: 1.5
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          description: 权限不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: forbidden
                message: Only admin or session creator can update agent config
        '404':
          description: 代理不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sim/sessions/{session_id}/agents/{agent_id}/performance:
    get:
      tags:
        - agents
      summary: 获取 AI 代理绩效统计
      description: 查看指定 AI 代理的详细交易绩效数据。
      operationId: getAgentPerformance
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - $ref: '#/components/parameters/AgentId'
        - name: from_tick
          in: query
          description: 统计起始 tick
          required: false
          schema:
            type: integer
        - name: to_tick
          in: query
          description: 统计结束 tick
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: 绩效统计数据
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentPerformance'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 代理不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sim/sessions/{session_id}/pools:
    get:
      tags:
        - pools
      summary: 获取代理池列表
      description: 查看会话中所有代理池的配置和统计信息。
      operationId: listPools
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '200':
          description: 代理池列表
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolListResponse'
              example:
                pools:
                  - pool_code: retail_pool
                    name: 散户代理池
                    weight: 1.0
                    initial_capital: 100000.0
                    turnover_limit: 0.05
                    agent_count: 5
                    total_capital: 492500.0
                    total_inventory: 750.0
                    strategies:
                      - RetailSentimentAgent
                  - pool_code: prop_pool
                    name: 游资代理池
                    weight: 2.5
                    initial_capital: 300000.0
                    turnover_limit: 0.15
                    agent_count: 3
                    total_capital: 915000.0
                    total_inventory: 0.0
                    strategies:
                      - PropMomentumAgent
                total: 4
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 会话不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/sim/sessions/{session_id}/pools/{pool_code}/stats:
    get:
      tags:
        - pools
      summary: 获取代理池统计数据
      description: 查看代理池在当前 tick 的交易流量统计。
      operationId: getPoolStats
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: pool_code
          in: path
          required: true
          schema:
            type: string
          example: retail_pool
      responses:
        '200':
          description: 代理池统计
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoolStats'
              example:
                pool_code: retail_pool
                tick: 1234
                gross_buy: 12500.0
                gross_sell: 8700.0
                net_flow: 3800.0
                turnover_used: 0.043
                turnover_limit: 0.05
                turnover_remaining: 0.007
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '404':
          description: 代理池不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    SessionId:
      name: session_id
      in: path
      required: true
      schema:
        type: integer
      example: 123

    AgentId:
      name: agent_id
      in: path
      required: true
      schema:
        type: string
      example: retail-agent-001

  schemas:
    AgentListResponse:
      type: object
      required:
        - agents
        - total
      properties:
        agents:
          type: array
          items:
            $ref: '#/components/schemas/AgentSummary'
        total:
          type: integer

    AgentSummary:
      type: object
      required:
        - agent_id
        - participant_id
        - behavior_category
        - weight
        - cash_balance
        - inventory
        - performance
        - config
      properties:
        agent_id:
          type: string
        participant_id:
          type: string
        behavior_category:
          type: string
          enum: [retail, prop, institutional, market_maker]
        weight:
          type: number
          format: double
        cash_balance:
          type: number
          format: double
        inventory:
          type: number
          format: double
        performance:
          $ref: '#/components/schemas/PerformanceSummary'
        config:
          $ref: '#/components/schemas/AgentConfig'

    AgentDetail:
      allOf:
        - $ref: '#/components/schemas/AgentSummary'
        - type: object
          properties:
            recent_trades:
              type: array
              items:
                $ref: '#/components/schemas/TradeRecord'
            created_at:
              type: string
              format: date-time

    AgentConfig:
      type: object
      properties:
        profit_target:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 盈利目标（百分比）
        stop_loss:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 止损阈值（百分比）
        herd_behavior_strength:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 羊群行为强度
        momentum_sensitivity:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 动量敏感度
        risk_tolerance:
          type: number
          format: double
          minimum: 0
          maximum: 1
          description: 风险容忍度

    AgentConfigUpdate:
      type: object
      properties:
        profit_target:
          type: number
          format: double
          minimum: 0
          maximum: 1
        stop_loss:
          type: number
          format: double
          minimum: 0
          maximum: 1
        herd_behavior_strength:
          type: number
          format: double
          minimum: 0
          maximum: 1
        momentum_sensitivity:
          type: number
          format: double
          minimum: 0
          maximum: 1
        risk_tolerance:
          type: number
          format: double
          minimum: 0
          maximum: 1

    AgentConfigUpdateResponse:
      type: object
      required:
        - status
        - agent_id
        - message
        - effective_tick
      properties:
        status:
          type: string
          enum: [updated]
        agent_id:
          type: string
        message:
          type: string
        effective_tick:
          type: integer

    PerformanceSummary:
      type: object
      required:
        - total_trades
        - win_rate
        - pnl
        - avg_trade_size
      properties:
        total_trades:
          type: integer
          description: 总交易次数
        win_rate:
          type: number
          format: double
          description: 盈利交易占比
        pnl:
          type: number
          format: double
          description: 累计盈亏
        avg_trade_size:
          type: number
          format: double
          description: 平均交易规模

    AgentPerformance:
      allOf:
        - $ref: '#/components/schemas/PerformanceSummary'
        - type: object
          properties:
            max_drawdown:
              type: number
              format: double
              description: 最大回撤
            sharpe_ratio:
              type: number
              format: double
              description: 夏普比率
            daily_returns:
              type: array
              items:
                type: number
                format: double
              description: 每日收益率序列
            trade_distribution:
              type: object
              properties:
                buy_count:
                  type: integer
                sell_count:
                  type: integer
                avg_buy_price:
                  type: number
                  format: double
                avg_sell_price:
                  type: number
                  format: double

    TradeRecord:
      type: object
      properties:
        trade_id:
          type: string
        tick:
          type: integer
        side:
          type: string
          enum: [BUY, SELL]
        price:
          type: number
          format: double
        quantity:
          type: number
          format: double
        counterparty_type:
          type: string
        executed_at:
          type: string
          format: date-time

    PoolListResponse:
      type: object
      required:
        - pools
        - total
      properties:
        pools:
          type: array
          items:
            $ref: '#/components/schemas/PoolSummary'
        total:
          type: integer

    PoolSummary:
      type: object
      required:
        - pool_code
        - name
        - weight
        - initial_capital
        - turnover_limit
        - agent_count
        - total_capital
        - total_inventory
        - strategies
      properties:
        pool_code:
          type: string
        name:
          type: string
        weight:
          type: number
          format: double
        initial_capital:
          type: number
          format: double
        turnover_limit:
          type: number
          format: double
          description: 每 tick 最大换手率（资金占比）
        agent_count:
          type: integer
          description: 池中代理数量
        total_capital:
          type: number
          format: double
          description: 池总资金
        total_inventory:
          type: number
          format: double
          description: 池总持仓
        strategies:
          type: array
          items:
            type: string
          description: 使用的策略列表

    PoolStats:
      type: object
      required:
        - pool_code
        - tick
        - gross_buy
        - gross_sell
        - net_flow
        - turnover_used
        - turnover_limit
        - turnover_remaining
      properties:
        pool_code:
          type: string
        tick:
          type: integer
        gross_buy:
          type: number
          format: double
          description: 本 tick 总买入金额
        gross_sell:
          type: number
          format: double
          description: 本 tick 总卖出金额
        net_flow:
          type: number
          format: double
          description: 净流入（gross_buy - gross_sell）
        turnover_used:
          type: number
          format: double
          description: 已使用换手率
        turnover_limit:
          type: number
          format: double
          description: 换手率限制
        turnover_remaining:
          type: number
          format: double
          description: 剩余可用换手率

    ErrorResponse:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
        message:
          type: string
        details:
          type: object
          additionalProperties: true

  responses:
    UnauthorizedError:
      description: 未授权
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: unauthorized
            message: Invalid or expired JWT token
