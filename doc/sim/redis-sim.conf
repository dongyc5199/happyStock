# Sample Redis configuration tailored for the simulation backend.

appendonly yes
appendfsync everysec

# Optional: 512mb recommended for local smoke testing.
# maxmemory 512mb
maxmemory-policy allkeys-lru

tcp-keepalive 60
hash-max-ziplist-entries 512

# Authentication
requirepass SimRedisPass!

# Enable basic monitoring-friendly settings.
latency-monitor-threshold 100
slowlog-log-slower-than 10000
slowlog-max-len 256
